name: spec
services:
  web:
    image: docker.io/library/nginx:1.27-alpine
    command: ["nginx", "-g", "daemon off;"]
    environment:
      A: "1"
    labels:
      team: home
      anastasis.project: spoofed
    volumes:
      - data:/data
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }
    x-anastasis:
      expose: "8000:80"
volumes:
  data:
